name: 보상검색기 APK 빌드

on:
  push:
    branches: [bosang-search]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bosang-search-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 테스트 + APK 빌드
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: 테스트 결과
        if: always()
        run: grep -h "<testsuite " app/build/test-results/testDebugUnitTest/*.xml | sed -E 's/.*name="([^"]+)" tests="([0-9]+)" skipped="([0-9]+)" failures="([0-9]+)" errors="([0-9]+)".*/\1 tests=\2 skipped=\3 failures=\4 errors=\5/'

      - name: APK 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk bosang-search.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bosang-search-apk
          path: bosang-search.apk

      - name: 최신 APK 다운로드 링크 갱신
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete bosang-search-latest --yes --cleanup-tag || true
          gh release create bosang-search-latest bosang-search.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "보상검색기 최신 APK" \
            --notes "커밋 ${GITHUB_SHA::7} 빌드 · $(date -u +'%Y-%m-%d %H:%M UTC')"
